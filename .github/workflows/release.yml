name: Build and Release CBMS Insights Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

env:
  RELEASE_DIR: release

concurrency:
  group: cbms-insights-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate repository safety
        run: npm run validate:project

      - name: Validate dependency and release contract
        run: npm run validate:dependencies

      - name: Verify package version matches tag
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = "${env:GITHUB_REF_NAME}" -replace '^v',''
          if ($packageVersion -ne $tagVersion) {
            Write-Error "Release tag v$tagVersion must exactly match package.json version $packageVersion."
            exit 1
          }

      - name: Build production web application
        run: npm run build

      - name: Build Windows NSIS installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Validate generated installer and updater metadata
        run: npm run validate:release

      - name: Inspect release directory
        shell: pwsh
        run: |
          if (-not (Test-Path $env:RELEASE_DIR)) {
            Write-Error "Release directory was not created."
            exit 1
          }

          Get-ChildItem $env:RELEASE_DIR -File |
            Select-Object Name, Length |
            Sort-Object Name |
            Format-Table -AutoSize

      - name: Create GitHub Release if needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = "CBMS-Insights-Setup-$($tag -replace '^v','').exe"
          $yml = "latest.yml"
          $blockmap = "CBMS-Insights-Setup-$($tag -replace '^v','').exe.blockmap"

          $existingJson = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "CBMS Insights $tag" `
              --generate-notes `
              --latest
            if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub Release $tag" }
            $existing = @()
          } else {
            $existing = @((($existingJson | ConvertFrom-Json).assets | ForEach-Object { $_.name }))
            Write-Host "Release $tag already exists. Existing assets: $($existing -join ', ')"
          }

          $expected = @($exe, $yml, $blockmap)
          $presentExpected = @($existing | Where-Object { $expected -contains $_ })

          if ($presentExpected.Count -eq $expected.Count) {
            throw "Release $tag already contains all updater assets. Refusing to overwrite an existing release."
          }

          if ($presentExpected.Count -gt 0) {
            Write-Host "Some release assets already exist; this run will upload only missing assets."
          }

          foreach ($asset in $expected) {
            if ($existing -contains $asset) {
              Write-Host "Keeping existing release asset: $asset"
              continue
            }

            $localPath = Join-Path $env:RELEASE_DIR $asset
            if (-not (Test-Path $localPath)) {
              throw "Missing expected local asset: $localPath"
            }

            gh release upload $tag $localPath --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload $asset" }
          }

      - name: Verify published updater assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v',''
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })

          $expected = @(
            "CBMS-Insights-Setup-$version.exe",
            "latest.yml",
            "CBMS-Insights-Setup-$version.exe.blockmap"
          )

          foreach ($asset in $expected) {
            if ($names -notcontains $asset) {
              throw "GitHub Release is missing expected updater asset: $asset"
            }
          }

          $unexpectedInstallerCount = @($names | Where-Object { $_ -match '^CBMS-Insights-Setup-.*\.exe$' }).Count
          if ($unexpectedInstallerCount -ne 1) {
            throw "Expected exactly one Windows installer in the release; found $unexpectedInstallerCount."
          }

          Write-Host "Published updater assets:"
          $expected | ForEach-Object { Write-Host " - $_" }

      - name: Upload release outputs as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: CBMS-Insights-Windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
